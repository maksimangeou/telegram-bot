databaseChangeLog:
  - changeSet:
      id: create-notification-task-table
      author: maksimzadoroznyj
      changes:
        - createTable:
            tableName: notification_task
            columns:
              - column:
                  name: id
                  type: bigserial
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: chat_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: message_text
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: notification_date
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  defaultValue: now()
              - column:
                  name: sent
                  type: boolean
                  defaultValue: false